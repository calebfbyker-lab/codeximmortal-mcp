name: Pilot acceptance and build
on:
  push:
    branches: [pilot/persisted-inquiries]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Sandbox HTTP acceptance tests
        run: npm test -- src/pilot/inquiries.test.ts src/pilot/secured-inquiries.test.ts
      - name: TypeScript build
        if: ${{ !cancelled() }}
        run: npm run build
