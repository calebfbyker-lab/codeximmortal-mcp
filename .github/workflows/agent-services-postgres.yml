name: Agent services PostgreSQL tests
on:
  push:
    branches: [feat/agent-service-contracts, feat/agent-native-commerce-api]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: codex_agent_ci
          POSTGRES_USER: codex_ci
          POSTGRES_PASSWORD: synthetic_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codex_ci -d codex_agent_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://codex_ci:synthetic_ci_only@localhost:5432/codex_agent_ci
      CODEX_DB_TEST_ACK: disposable-database-only
      REQUIRE_DB_TESTS: 'true'
      X402_ENABLED: 'false'
      PRICING_APPROVED_URLS: '[]'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare evidence directory
        run: mkdir -p ci-evidence
      - name: Record tested commit and runtime
        run: |
          git rev-parse HEAD > ci-evidence/commit.txt
          node --version > ci-evidence/node-version.txt
          npm --version > ci-evidence/npm-version.txt
      - run: npm install --no-audit --no-fund
      - name: Run full suite with machine-readable evidence
        run: npm test -- --reporter=default --reporter=json --outputFile=ci-evidence/vitest.json
      - name: Require passing tests with zero skips
        if: ${{ !cancelled() && (success() || failure()) }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('ci-evidence/vitest.json', 'utf8'));
          const assertions = (report.testResults ?? []).flatMap(suite => suite.assertionResults ?? []);
          if (report.success !== true || !Number.isInteger(report.numTotalTests) ||
              report.numTotalTests < 1 || report.numFailedTests !== 0 ||
              report.numPendingTests !== 0 || assertions.length !== report.numTotalTests ||
              assertions.some(test => test.status !== 'passed')) {
            throw new Error('test_evidence_failed_skipped_or_incomplete');
          }
          console.log(JSON.stringify({ total: report.numTotalTests, passed: assertions.length, skipped: 0 }));
          NODE
      - name: Compile TypeScript even if tests fail
        if: ${{ !cancelled() && (success() || failure()) }}
        run: npm run build
      - name: Retain verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent-services-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-evidence/
          if-no-files-found: warn
          retention-days: 14
