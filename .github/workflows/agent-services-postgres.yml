name: Agent services PostgreSQL tests
on:
  push:
    branches: [feat/agent-service-contracts]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: codex_agent_ci
          POSTGRES_USER: codex_ci
          POSTGRES_PASSWORD: synthetic_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codex_ci -d codex_agent_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://codex_ci:synthetic_ci_only@localhost:5432/codex_agent_ci
      CODEX_DB_TEST_ACK: disposable-database-only
      REQUIRE_DB_TESTS: 'true'
      X402_ENABLED: 'false'
      PRICING_APPROVED_URLS: '[]'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Compile TypeScript even if tests fail
        if: ${{ !cancelled() && (success() || failure()) }}
        run: npm run build
