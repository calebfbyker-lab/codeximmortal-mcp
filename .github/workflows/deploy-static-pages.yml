name: Deploy static agent surfaces to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'catalog.json'
      - 'llms.txt'
      - 'agent.json'
      - 'mcp-manifest.json'
      - 'server.json'
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/deploy-static-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir -p _site/docs
          cp catalog.json llms.txt agent.json mcp-manifest.json server.json README.md _site/
          cp -r docs/. _site/docs/
          printf 'User-agent: *\nAllow: /\n' > _site/robots.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
